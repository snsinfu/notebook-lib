[workspace]
name = "lib"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.10"
numpy = "*"
scipy = "*"
matplotlib-base = "*"
polars = "*"
numba = "*"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
pyright = "*"

[environments]
default = { features = ["dev"] }

[tasks]
test = "pytest tests -q"
format = "ruff format lib tests examples"
lint = "ruff check lib tests examples"
typecheck = "pyright lib"
